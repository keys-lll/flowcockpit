name: Package 旅途知音 APK

on:
  push:
    branches: [main]
    paths:
      - 'A1/**'
      - '.github/workflows/travel-companion-apk.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: A1
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Build installable debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/旅途知音.apk"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: 旅途知音-APK
          path: ${{ runner.temp }}/旅途知音.apk
          if-no-files-found: error
          retention-days: 30
