name: Build Android APK (A1 MapLibre)

on:
  workflow_dispatch:
  push:
    paths:
      - "A1/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: A1/**/*.gradle.kts
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708
      - name: Install Android API 37
        run: |
         sdkmanager --install "platforms;android-37.0"
         sdkmanager --install "platform-tools"
      - name: Build debug APK
        working-directory: A1
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowCockpit-MapLibre-debug-APK
          path: A1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
